# Factorio 2.1 + Space Age の素材データ。
# 本体レシピは FactorioLab 試作（base 2.1.20）と wube/factorio-data の公式 prototype に合わせている。
# Space Age レシピは github.com/wube/factorio-data の space-age/prototypes/recipe.lua（master）が正。
# 日本語名は既存ファイルの表記を残し、新規はゲーム内公式（wiki.factorio.com/ja・用語辞典）に合わせた。
# 生産時間はレシピの基準時間。施設数は設備速度 1.0 換算になる。
# 組立機1は 0.5、組立機2は 0.75、組立機3は 1.25、石の炉は 1、鋼鉄の炉と電気炉は 2。
# 鋳造炉は 4、電磁プラントは 2、バイオチャンバーは 2、低温プラントは 2、破砕機は 1。
# 電動掘削機の採掘速度は 0.5 なので、鉱石の表示台数を 2 倍すると掘削機の台数になる。
# 原油は産出量 100% の油井（毎秒 10）。枯渇は含まない。
# ツリー計算は各アイテムの先頭レシピだけを使う。
# 石油ガスの先頭は軽油の分解、軽油の先頭は重油の分解、重油の先頭は発展的な石油加工。
# スペースサイエンスパックの先頭は Space Age の宇宙クラフト（鉄板・炭素・氷）。衛星打ち上げは使わない。
# 炭素の先頭は炭素質アステロイド破砕、氷の先頭は酸化物アステロイド破砕。
# 溶融鉄・溶融銅の先頭は溶岩からの鋳造。板・歯車などの先頭は従来の炉／組立で、鋳造は第2レシピ。
# ホルミウム鉱石の先頭は廃材リサイクル 100 回分（廃材 100、20 秒、ホルミウム鉱石 1。他は期待値の整数）。
# ウラン濃縮処理は確率産出を 1000 回分に換算している（鉱石 10000、時間 12000 秒、U-235 が 7、U-238 が 993）。
# 鉄／銅バクテリアは 10% を 10 回分に換算している。培養レシピは循環になるので入れていない。
# 循環になる kovarex 濃縮、石炭液化、使用済み燃料の再処理、ドラム缶、卵の増殖、アステロイド再処理は入れてない。
# ユマコ・ゼリーナット・ペンタポッドの卵・腐敗物は収穫／狩猟の原材料。バイターの卵は捕獲巣の空入力レシピ。
# 木材は試作データに生産レシピが無いので、手作業で 0.5 秒に 1 個の原材料にしている。
# 副産物は産出として記録するが、必要個数からは差し引かない。
# 種別はゲーム内 item-group（ロジスティクス／製作タブ）の日本語公式名。
# 物流 / 生産 / 中間生産物 / 戦闘 / 宇宙 / 流体。農業は独立タブではなく中間生産物または生産。
