# モンスターハンターワイルズの調合・装備データ。
# 調合レシピは公式調合一覧（調合No.001〜066）に合わせた。
# 武器・防具は公開Wiki（GameWith、mhwilds.com、Gamerch、Kiranico、Game8）の
# 生産・強化素材に合わせた。架空装備は入れていない。
# アイテム名はゲーム公式の日本語表記。
# ゲームに公式の調合時間・加工時間はない。
# Data_Loader は craft_time の欠損・null・0・空文字を拒否し、0.1〜86400 を要求する。
# そのため全レシピの craft_time は仕様下限の 0.1 秒（空欄相当の番兵値）に統一した。
# UI 上は秒数が付くが、実時間データではない。
# こんがり肉は消耗品。産出は生肉1個あたりの典型値5個（切り分け成功で最大12個）。
# 複数レシピがあるアイテムは、調合番号の若い方／強化経路の主レシピを先頭に置いている。
# ツリー計算は各アイテムの先頭レシピだけを使う。
# 食事（携帯焚き火台の「食事を焼く」）は定食ではなく組み合わせなので入れてない。
# 武器は全14種ホープⅠ〜エスペラ。ケマトリス7種（大剣・太刀・片手剣・双剣・ランス・ガンランス・弓）、
# チャタカブラ5種（片手剣・ハンマー・チャアク・操虫棍・ヘビィ）、ボーン（大剣・狩猟笛・スラアク）、
# バーラハーラ（ランス・狩猟笛）を最終強化まで収録。
# 上位防具でαとβの生産素材が同一のものは「○○α/β」として1アイテムにまとめた。
# ホープα・レザーα・チェーンα・ボーンα・アーティアαはβが無い／未確認のためαのみ。
# 武器にリオレイア／リオレウス／ゴア／アルシュベルド大剣とレ・ダウ軽弩を追加。
# 防具にスキュラ下位、エグゾルス／シュバルカ／無垢ナル龍のα/β、アーティアαを追加。

