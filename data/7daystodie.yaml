# 7 Days to Die (7DTD) 1.0 正式リリース版基準の生産データ。
# 公式日本語ローカライズ名称に準拠。
# 生産時間はゲーム内基本レシピの秒数（スキル・パーク補正なし）。
# 炉、作業台、化学実験ステーション、焚き火、セメントミキサー、手荷物クラフトに対応。
# 炉で生産する金属・建材は、炉への投入原料（生鉄、粘土の土、小さな石、生鉛、真鍮）を直接の必要素材として展開。
# 採取・採掘・狩猟・探索・解体で入手する基本資源は入力なしレシピ（原材料）として表現。
# 複数レシピがある場合（化学ステーションと焚き火など）は、効率の高い標準ステーションのレシピを先頭（Recipes[0]）に配置。
# 先頭レシピのみを辿った生産ツリーに循環（閉路）は存在しない。
# 種別はゲーム内カテゴリ分類（資源 / 建築 / 道具 / 武器 / 弾薬 / 医療 / 食料 / 車両 / 電気）に準拠。

