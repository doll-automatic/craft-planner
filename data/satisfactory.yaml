# Satisfactory 1.0 以降の素材データ。
# レシピ・生産時間・入出力量は Satisfactory日本語 Wiki*「レシピ一覧」（wikiwiki.jp/sf-jp）と
# SCIM（satisfactory-calculator.com/ja）の 1.0 データを突き合わせて採った。食い違いは SCIM（1.0）を優先した。
# アイテム名は SCIM 日本語版（ゲーム内の公式日本語表記）に合わせた。
# 種別はゲーム内のアイテムカテゴリの日本語名。Satisfactory日本語 Wiki*「素材」の分類と同じにしている。
# 資源 / パワー・シャード / バイオマス / 鉱物 / 消耗品 / 弾薬 / インゴット / 基本部品 / 電子機器 /
# 産業用部品 / 通信 / 石油製品 / 燃料 / 先進的な精製 / 量子技術 / 容器入り / 貯蔵庫 / 原子力 / 軌道エレベーター。
# 生産時間はレシピのサイクル秒（クロック 100%）。液体と気体の個数は m³ で数える。
# 採掘物は空入力の原材料にしている。採鉱機 Mk.1 は「普通」純度の鉱脈で毎分 60 なので 1 秒に 1 個。
# 揚水ポンプは毎分 120m³、原油抽出機は「普通」の鉱脈で毎分 120m³、地下資源抽出機は「普通」の井戸で毎分 60m³。
# 木・葉・菌糸・パワー・スラッグは手で集める原材料。採取の速度はゲームに無いので 1 秒に 1 個にしている。
# ツリー計算は各アイテムの先頭レシピだけを使う。先頭は標準レシピで、代替レシピは 2 番目以降に置いた。
# 圧縮石炭・合成樹脂・廃重油はゲーム内に単独の標準レシピが無いので、代替レシピ（原油などから作るもの）を先頭にした。
# FICSITEのインゴットは標準レシピが 3 つある。先頭はアルミ、2 番目以降にカテリウムと鉄を置いた。
# 循環を避けるため、プラスチック・ゴムの先頭は原油からの精製、燃料の先頭も原油からの精製にした。
# リサイクル・プラスチックとリサイクル・ゴム（互いを素材にする）は 2 番目以降に置いている。
# 容器入りの液体は空の容器・空の液体タンクと液体から作る。容器から取り出すレシピは液体側の 2 番目以降に置いた。
# 副産物は産出として記録するが、必要個数からは差し引かない。
# バッテリーは公式が端数（硫酸 2.5、水 1.5）なので、2 回分（6 秒）に換算して整数にしている。
# ウラン廃棄物とプルトニウム廃棄物は、原子力発電所が燃料棒 1 本を燃やしきる時間をレシピ時間にしている。
# 励起フォトニック物質は変換機が素材なしで作る。空入力だが原材料ではない。
name: "Satisfactory"

