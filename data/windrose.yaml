# 木材・建材加工、金属製錬、織物・革加工、道具・装備、銃火器・弾薬、艦砲・船体装備、船体建造、薬品・錬金術、食料を網羅。
# レシピ時間（craft_time）はゲーム内レシピの秒数（0.1〜86400）。
# 原材料（採取・伐採・採石・採掘・狩猟・交易など）は inputs: [] のレシピとして表現。
# 先頭レシピ（Recipes[0]）固定で循環がないDAG構造。

