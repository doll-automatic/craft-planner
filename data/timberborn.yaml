# Timberborn の素材データ。
# Update 5 / Update 6 最新の公式レシピ・公式日本語ローカライズ表記に準拠。
# フォークテイル（Folktails）およびアイアン・ティース（Iron Teeth）両陣営の生産チェーンを包含。
# 木工・建材、食料・農業、金属・工業、生化学・ボット、水利、ウェルビーイング関連の生産品を網羅。
# レシピ時間（craft_time）はゲーム内レシピの作業時間（CycleDurationInHours）。
# 燃料（丸太）を消費する施設（パン屋、グリル、精錬所、遠心分離機等）は、丸太1本あたりのサイクル数（10回または5回）に換算して整数比率を保ったレシピを先頭に設定し、単一サイクルのレシピを代替として収録。
# 原材料・農作物・水・採取物は入力なし（inputs: []）のレシピとして表現。
# ツリー展開・集計・施設数算出は各アイテムの先頭レシピ（Recipes[0]）を使用する。

